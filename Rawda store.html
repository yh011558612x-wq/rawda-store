<title>Rawda store</title>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf5ef;--card:#fff;--tx:#3b2a22;--mut:#8a7468;--ac:#6b4332;--acx:#fff;--ln:#eadfd3;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1613;--card:#2a201b;--tx:#f3e8dd;--mut:#b5a094;--ac:#d9a98c;--acx:#1d1613;--ln:#3d302a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1613;--card:#2a201b;--tx:#f3e8dd;--mut:#b5a094;--ac:#d9a98c;--acx:#1d1613;--ln:#3d302a;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Tajawal,system-ui,sans-serif}
header{text-align:center;padding:34px 16px 14px}
h1{margin:0;font-size:30px;letter-spacing:.5px;color:var(--ac)}header p{margin:6px 0 0;color:var(--mut)}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px 12px}
.chip{border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:7px 16px;border-radius:99px;font:inherit;cursor:pointer}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px;max-width:1000px;margin:auto}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:var(--ln)}
.card .b{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}
.nm{font-weight:700;font-size:14px}.pr{color:var(--mut);font-size:13px}
.out{position:absolute;top:8px;right:8px;background:#000a;color:#fff;border-radius:99px;padding:2px 10px;font-size:12px}
.ph{position:relative}
button{font:inherit}.btn{border:0;background:var(--ac);color:var(--acx);border-radius:10px;padding:8px 12px;cursor:pointer;text-align:center;text-decoration:none;font-size:14px}
.btn.s{background:transparent;color:var(--ac);border:1px solid var(--ac)}.btn.r{background:transparent;color:#c0392b;border:1px solid #c0392b}
.row{display:flex;gap:6px}.row>*{flex:1}
.bar{background:var(--card);border:1px dashed var(--ac);border-radius:12px;margin:10px 12px;padding:10px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:976px;margin-inline:auto}
dialog{border:0;border-radius:16px;background:var(--card);color:var(--tx);width:min(92vw,420px);padding:18px}
dialog::backdrop{background:#0008}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit}
footer{text-align:center;color:var(--mut);font-size:12px;padding:24px}
#msg{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ac);color:var(--acx);padding:8px 16px;border-radius:99px;display:none}
</style></head><body>

<script>
const D=JSON.parse(document.getElementById('data').textContent);
let owner=false,art=null,cat='الكل';
const $=id=>document.getElementById(id);
const toast=t=>{const m=$('msg');m.textContent=t;m.style.display='block';setTimeout(()=>m.style.display='none',2200)};
function mk(tag,props,...kids){const e=document.createElement(tag);Object.assign(e,props||{});kids.flat().forEach(k=>e.append(k));return e}
function render(){
 $('st').textContent=D.store;$('tg').textContent=D.tag;document.title=D.store;
 const cats=['الكل',...new Set(D.prods.map(p=>p.cat))];
 $('chips').replaceChildren(...cats.map(c=>mk('button',{className:'chip'+(c===cat?' on':''),textContent:c,onclick:()=>{cat=c;render()}})));
 const bar=$('bar');bar.replaceChildren();
 if(owner){bar.className='bar';bar.append(mk('button',{className:'btn',textContent:'+ إضافة منتج',onclick:()=>edit()}),mk('button',{className:'btn s',textContent:'إعدادات المتجر',onclick:settings}))}else bar.className='';
 const list=D.prods.filter(p=>cat==='الكل'||p.cat===cat);
 $('app').replaceChildren(...list.map(p=>{
  const ph=mk('div',{className:'ph'},mk('img',{src:p.img,alt:p.name,loading:'lazy'}));
  if(!p.avail)ph.append(mk('span',{className:'out',textContent:'نفد'}));
  const b=mk('div',{className:'b'},mk('div',{className:'nm',textContent:p.name}),mk('div',{className:'pr',textContent:p.price?p.price:'اسألي عن السعر'}));
  if(D.wa&&p.avail)b.append(mk('a',{className:'btn',textContent:'اطلبي واتساب',target:'_blank',href:'https://wa.me/'+D.wa+'?text='+encodeURIComponent('أريد الطلب: '+p.name+' - '+D.store)}));
  if(owner)b.append(mk('div',{className:'row'},mk('button',{className:'btn s',textContent:'تعديل',onclick:()=>edit(p)}),mk('button',{className:'btn r',textContent:'حذف',onclick:()=>{if(confirm('حذف '+p.name+'؟')){D.prods=D.prods.filter(x=>x!==p);save()}}})));
  return mk('div',{className:'card'},ph,b)}));
 $('ft').textContent='© '+D.store;
}
function field(l,el){return [mk('label',{textContent:l}),el]}
function edit(p){
 const n=p||{id:'p'+Date.now(),name:'',cat:cat==='الكل'?'تنانير':cat,price:'',avail:true,img:''};
 const name=mk('input',{value:n.name}),price=mk('input',{value:n.price,placeholder:'مثال: 450 ج'}),ct=mk('input',{value:n.cat,setAttribute:0});
 const av=mk('select',{},mk('option',{value:'1',textContent:'متاح'}),mk('option',{value:'0',textContent:'نفد'}));av.value=n.avail?'1':'0';
 const file=mk('input',{type:'file',accept:'image/*'});let img=n.img;
 file.onchange=()=>{const f=file.files[0];if(!f)return;const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const s=Math.min(1,560/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);img=c.toDataURL('image/jpeg',.72)};i.src=u};
 const ok=mk('button',{className:'btn',textContent:'حفظ',onclick:()=>{if(!name.value.trim()||!img){alert('اكتبي الاسم وأضيفي صورة');return}Object.assign(n,{name:name.value.trim(),price:price.value.trim(),cat:ct.value.trim()||'أخرى',avail:av.value==='1',img});if(!p)D.prods.unshift(n);$('dlg').close();save()}});
 $('dc').replaceChildren(...field('اسم المنتج',name),...field('السعر',price),...field('القسم (تنانير / عبايات / ...)',ct),...field('الحالة',av),...field(p?'تغيير الصورة (اختياري)':'الصورة',file),mk('div',{className:'row',style:'margin-top:14px'},ok,mk('button',{className:'btn s',textContent:'إلغاء',onclick:()=>$('dlg').close()})));
 $('dlg').showModal();
}
function settings(){
 const s=mk('input',{value:D.store}),t=mk('input',{value:D.tag}),w=mk('input',{value:D.wa,placeholder:'مثال: 201012345678',inputMode:'numeric'});
 const ok=mk('button',{className:'btn',textContent:'حفظ',onclick:()=>{D.store=s.value.trim()||D.store;D.tag=t.value.trim();D.wa=w.value.replace(/\D/g,'');$('dlg').close();save()}});
 $('dc').replaceChildren(...field('اسم المتجر',s),...field('الشعار',t),...field('رقم واتساب (بكود الدولة، بدون +)',w),mk('div',{className:'row',style:'margin-top:14px'},ok,mk('button',{className:'btn s',textContent:'إلغاء',onclick:()=>$('dlg').close()})));
 $('dlg').showModal();
}
async function save(){
 if(!art){toast('الحفظ غير متاح');return}
 const c=document.documentElement.cloneNode(true);
 ['app','chips','bar'].forEach(i=>c.querySelector('#'+i).replaceChildren());
